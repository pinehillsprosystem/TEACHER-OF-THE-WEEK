<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro eSports Gaming Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-base: #030712;
            --surface-card: rgba(15, 23, 42, 0.75);
            --surface-card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(circle at 50% -10%, rgba(79, 70, 229, 0.25), transparent 50%),
                radial-gradient(circle at 0% 100%, rgba(6, 182, 212, 0.15), transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(236, 72, 153, 0.1), transparent 40%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 0.8rem 0.4rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 820px;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* HEADER & LOGIN BAR GRID */
        .top-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.75rem;
        }
        @media(min-width: 640px) {
            .top-grid { grid-template-columns: 1.4fr 1fr; }
        }

        header, .login-panel {
            background: linear-gradient(180deg, rgba(30, 41, 59, 0.5) 0%, rgba(15, 23, 42, 0.2) 100%);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 0.9rem 1rem;
            border-radius: 16px;
            backdrop-filter: blur(16px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
            gap: 10px;
            flex-wrap: wrap;
        }

        .badge-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 9999px;
            background: rgba(6, 182, 212, 0.1);
            border: 1px solid rgba(6, 182, 212, 0.3);
            color: #22d3ee;
            font-size: 0.65rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .badge-header span {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: #22d3ee;
            box-shadow: 0 0 8px #22d3ee;
            animation: pulseDot 1.5s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-view-ranks {
            background: linear-gradient(135deg, #7c3aed 0%, #4f46e5 100%);
            color: #ffffff;
            border: 1px solid rgba(168, 85, 247, 0.4);
            padding: 5px 12px;
            border-radius: 8px;
            font-size: 0.72rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
            transition: all 0.25s ease;
            letter-spacing: 0.03em;
        }

        .btn-view-ranks:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(124, 58, 237, 0.6); }

        header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: clamp(1.2rem, 3vw, 1.6rem);
            font-weight: 900;
            letter-spacing: 0.1em;
            background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.68rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            margin-top: 0.15rem;
            text-transform: uppercase;
        }

        /* PERMANENT LOGIN PANEL STYLES */
        .login-panel h3 {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.82rem;
            color: #fff;
            margin-bottom: 0.2rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .login-panel p {
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 0.6rem;
        }
        .login-form-group {
            display: flex;
            gap: 6px;
        }
        .login-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 7px 10px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.78rem;
            outline: none;
        }
        .login-input:focus { border-color: #22d3ee; box-shadow: 0 0 8px rgba(34, 211, 238, 0.3); }
        .login-btn {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: #fff;
            border: none;
            padding: 7px 14px;
            border-radius: 8px;
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
            white-space: nowrap;
        }
        .login-btn:hover { transform: translateY(-1px); }

        .user-logged-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(6, 182, 212, 0.08);
            border: 1px solid rgba(6, 182, 212, 0.25);
            padding: 8px 12px;
            border-radius: 10px;
        }
        .user-logged-info span { display: block; font-size: 0.62rem; color: var(--text-muted); text-transform: uppercase; font-weight: 800; }
        .user-logged-info strong { font-size: 0.85rem; color: #22d3ee; font-family: 'Orbitron', sans-serif; }
        .logout-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #f87171;
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.68rem;
            font-weight: 700;
            cursor: pointer;
        }
        .logout-btn:hover { background: rgba(248, 113, 113, 0.15); }

        /* LOADING STATE */
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3rem 1rem;
            background: var(--surface-card);
            border: 1px solid var(--surface-card-border);
            border-radius: 16px;
            backdrop-filter: blur(16px);
            gap: 0.75rem;
            text-align: center;
        }

        .spinner {
            width: 36px;
            height: 36px;
            border: 3px solid rgba(99, 102, 241, 0.15);
            border-top: 3px solid #6366f1;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ESPORTS PODIUM ARCHITECTURE */
        .podium-section {
            display: grid;
            grid-template-columns: 1fr 1.1fr 1fr;
            gap: 0.5rem;
            align-items: flex-end;
            width: 100%;
        }

        .podium-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-card-border);
            backdrop-filter: blur(16px);
            border-radius: 14px;
            padding: 0.75rem 0.4rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            position: relative;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .podium-card.rank-1 {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.95) 0%, rgba(15, 23, 42, 0.98) 100%);
            border: 1px solid rgba(251, 191, 36, 0.5);
            box-shadow: 0 8px 25px rgba(251, 191, 36, 0.2);
            padding-top: 0.9rem;
            padding-bottom: 0.9rem;
        }
        .podium-card.rank-2 { border-color: rgba(203, 213, 225, 0.35); }
        .podium-card.rank-3 { border-color: rgba(245, 158, 11, 0.35); }

        .podium-rank-pill {
            position: absolute;
            top: -9px;
            background: #030712;
            border: 1px solid rgba(255,255,255,0.1);
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.58rem;
            font-weight: 900;
        }
        .rank-1 .podium-rank-pill { border-color: #fbbf24; color: #fbbf24; background: rgba(251, 191, 36, 0.15); box-shadow: 0 0 8px rgba(251,191,36,0.4); }
        .rank-2 .podium-rank-pill { border-color: #cbd5e1; color: #cbd5e1; background: rgba(203, 213, 225, 0.15); }
        .rank-3 .podium-rank-pill { border-color: #f59e0b; color: #f59e0b; background: rgba(245, 158, 11, 0.15); }

        .podium-avatar-shield {
            width: 32px;
            height: 32px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            margin: 0.25rem 0 0.2rem 0;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .rank-1 .podium-avatar-shield { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); width: 38px; height: 38px; font-size: 1.1rem; }
        .rank-2 .podium-avatar-shield { background: linear-gradient(135deg, #cbd5e1 0%, #64748b 100%); }
        .rank-3 .podium-avatar-shield { background: linear-gradient(135deg, #f59e0b 0%, #b45309 100%); }

        .podium-name {
            font-size: 0.75rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            letter-spacing: 0.02em;
        }

        .podium-score {
            font-size: 0.95rem;
            font-weight: 900;
            color: #38bdf8;
            text-shadow: 0 0 8px rgba(56, 189, 248, 0.4);
            line-height: 1;
            margin-top: 0.15rem;
        }

        .podium-score-lbl {
            font-size: 0.45rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 2px;
        }

        .section-heading {
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin: 0.1rem 0 0 0.2rem;
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 0.45rem;
        }

        .teacher-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-card-border);
            backdrop-filter: blur(16px);
            border-radius: 12px;
            padding: 0.55rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.65rem;
            position: relative;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
            transition: all 0.25s ease;
        }

        .teacher-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .pos-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .tier-shield-badge {
            width: 30px;
            height: 30px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            flex-shrink: 0;
            box-shadow: 0 0 8px rgba(0,0,0,0.4);
        }

        .card-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            min-width: 0;
        }

        .teacher-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.4rem;
            width: 100%;
        }

        .teacher-name {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            letter-spacing: 0.02em;
        }

        .rank-tier-tag {
            font-size: 0.52rem;
            font-weight: 800;
            padding: 2px 6px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
            border: 1px solid transparent;
        }

        .glow-line-track {
            width: 100%;
            height: 5px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 9999px;
            position: relative;
            overflow: visible;
        }

        .glow-line-fill {
            height: 100%;
            border-radius: 9999px;
            position: relative;
            transition: width 1s ease;
        }

        .blue-fire {
            position: absolute;
            right: -7px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            pointer-events: none;
            z-index: 5;
        }

        .blue-fire-core {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 15%, #38bdf8 45%, #1d4ed8 85%, transparent 100%);
            box-shadow: 0 0 8px #38bdf8, 0 0 14px #2563eb;
            animation: firePulse 0.8s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes firePulse {
            0% { transform: scale(0.75); opacity: 0.8; }
            100% { transform: scale(1.25); opacity: 1; box-shadow: 0 0 12px #38bdf8, 0 0 20px #2563eb; }
        }

        .score-display {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            flex-shrink: 0;
            min-width: 50px;
            padding-left: 0.6rem;
            border-left: 1px solid rgba(255, 255, 255, 0.06);
        }

        .score-num {
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #38bdf8;
            text-shadow: 0 0 6px rgba(56, 189, 248, 0.4);
            line-height: 1;
        }

        .score-lbl {
            font-size: 0.45rem;
            font-weight: 800;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        /* Modal & Overlays */
        .modal-overlay, .celebration-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 7, 18, 0.85);
            backdrop-filter: blur(16px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .modal-overlay.active, .celebration-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: rgba(15, 23, 42, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            overflow: hidden;
        }

        .modal-header {
            padding: 1rem 1.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 { font-family: 'Orbitron', sans-serif; font-size: 0.9rem; font-weight: 800; color: var(--text-primary); letter-spacing: 0.05em; }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            width: 28px; height: 28px;
            border-radius: 50%;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold;
        }

        .modal-body { padding: 1rem 1.2rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.5rem; }

        .celebration-overlay { z-index: 2000; }
        .celebration-box {
            display: flex; flex-direction: column; align-items: center; text-align: center;
            padding: 2.2rem 1.4rem;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.9) 0%, rgba(15, 23, 42, 0.98) 100%);
            border: 2px solid rgba(251, 191, 36, 0.6);
            border-radius: 24px;
            box-shadow: 0 0 70px rgba(251, 191, 36, 0.3);
            max-width: 90%; width: 400px;
        }

        .celebration-subtitle { font-family: 'Orbitron', sans-serif; font-size: 0.65rem; font-weight: 800; letter-spacing: 0.2em; color: #fbbf24; text-transform: uppercase; margin-bottom: 0.4rem; }
        .celebration-teacher-name { font-family: 'Orbitron', sans-serif; font-size: clamp(1.6rem, 4.5vw, 2.2rem); font-weight: 900; background: linear-gradient(180deg, #ffffff 0%, #fbbf24 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 0.6rem; letter-spacing: 0.05em; }
        .celebration-shield { width: 80px; height: 80px; clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%); display: flex; align-items: center; justify-content: center; font-size: 2.4rem; margin: 0.3rem 0; }
        .celebration-rank-title { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; font-weight: 900; color: #ffffff; margin-top: 0.3rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .celebration-btn { margin-top: 1.2rem; background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #030712; border: none; padding: 10px 26px; font-size: 0.85rem; font-weight: 900; border-radius: 9999px; cursor: pointer; box-shadow: 0 0 20px rgba(251, 191, 36, 0.5); letter-spacing: 0.05em; }
    </style>
</head>
<body>

<div class="container">
    <!-- TOP GRID: Header & Permanent Login Panel -->
    <div class="top-grid">
        <header>
            <div class="header-top">
                <div class="badge-header">
                    <span></span> Live eSports Arena
                </div>
                <button class="btn-view-ranks" id="openModalBtn">🏆 Rank Criteria</button>
            </div><br>
            <h1>TEACHER OF THE WEEK</h1>
            <p>Realtime Competitive Performance Analytics</p>
        </header>

        <!-- PERMANENT LOGIN PANEL ON THE SIDE -->
        <div class="login-panel" id="loginPanelContainer">
            <!-- Dynamic Content (Will show either input form or logged-in status) -->
        </div>
    </div>

    <!-- LOADING STATE -->
    <div class="loading-state" id="loadingState">
        <div class="spinner"></div>
        <p style="color: var(--text-secondary); font-weight: 600; font-size: 0.8rem;">Syncing live data from Firebase...</p>
    </div>

    <!-- ESPORTS PODIUM CONTAINER -->
    <div id="podiumContainer" style="display: none; flex-direction: column; gap: 0.3rem;">
        <div class="section-heading">🏆 Top Elite Standings</div>
        <div class="podium-section" id="podiumGrid"></div>
    </div>

    <!-- GLOBAL STANDINGS -->
    <div id="leaderboardContainer" style="display: none; flex-direction: column; gap: 0.3rem;">
        <div class="section-heading">📊 Global Standings</div>
        <div class="leaderboard" id="leaderboardList"></div>
    </div>
</div>

<!-- Modal Criteria Chart -->
<div class="modal-overlay" id="rankModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>🏆 Rank Criteria Chart</h3>
            <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body" id="modalChartBody"></div>
    </div>
</div>

<!-- Full Screen Rank Up Celebration Overlay -->
<div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-box">
        <div class="celebration-subtitle">🎉 LIVE RANK UP ACHIEVED 🎉</div>
        <div class="celebration-teacher-name" id="celebTeacherName">Bushra</div>
        <div class="celebration-shield" id="celebShield">👑</div>
        <div class="celebration-rank-title" id="celebRankTitle">MASTER</div>
        <button class="celebration-btn" id="closeCelebBtn">AWESOME!</button>
    </div>
</div>

<!-- Firebase Modular SDK & Script -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, runTransaction, push, get } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuHPFJpWH-ururuUcpuDKf0vskaKFvcwQ",
      authDomain: "teacher-of-the-week-81ddb.firebaseapp.com",
      projectId: "teacher-of-the-week-81ddb",
      storageBucket: "teacher-of-the-week-81ddb.appspot.com",
      messagingSenderId: "120486545659",
      appId: "1:120486545659:web:ff734bdbeb88f7de82485e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // --- PERMANENT LOGIN PANEL & VISITOR TRACKER ---
    function initLoginSystem() {
        const panel = document.getElementById('loginPanelContainer');
        let savedName = localStorage.getItem('eSports_GuestName');

        if (!savedName) {
            panel.innerHTML = `
                <h3>🔐 Visitor Login</h3>
                <p>Apna naam likh kar login karein taaki visit record ho sakay:</p>
                <div class="login-form-group">
                    <input type="text" id="panelNameInput" class="login-input" placeholder="Apna naam likhein..." autocomplete="off">
                    <button class="login-btn" id="panelLoginBtn">Login 🚀</button>
                </div>
            `;

            document.getElementById('panelLoginBtn').onclick = () => {
                let val = document.getElementById('panelNameInput').value.trim();
                if (!val) val = "Anonymous Guest";
                localStorage.setItem('eSports_GuestName', val);
                logVisitorData(val);
                initLoginSystem(); // Re-render panel
            };

            document.getElementById('panelNameInput').onkeydown = (e) => {
                if (e.key === 'Enter') {
                    let val = document.getElementById('panelNameInput').value.trim();
                    if (!val) val = "Anonymous Guest";
                    localStorage.setItem('eSports_GuestName', val);
                    logVisitorData(val);
                    initLoginSystem();
                }
            };
        } else {
            panel.innerHTML = `
                <h3>🟢 Logged In</h3>
                <div class="user-logged-box">
                    <div class="user-logged-info">
                        <span>Active Visitor</span>
                        <strong>${savedName}</strong>
                    </div>
                    <button class="logout-btn" id="panelLogoutBtn">Switch ID</button>
                </div>
            `;

            document.getElementById('panelLogoutBtn').onclick = () => {
                localStorage.removeItem('eSports_GuestName');
                initLoginSystem();
            };
        }
    }

    function logVisitorData(guestName) {
        const ua = navigator.userAgent;
        let deviceName = "Unknown Device";

        if (/android/i.test(ua)) {
            let match = ua.match(/;\s*([^;]+)\s+Build\//);
            if (match && match[1]) deviceName = match[1].trim();
            else deviceName = "Android Device";
        } else if (/iphone|ipad|ipod/i.test(ua)) {
            if (/ipad/i.test(ua)) deviceName = "iPad";
            else deviceName = "iPhone";
        } else if (/windows/i.test(ua)) {
            deviceName = "Windows PC / Laptop";
        } else if (/macintosh|mac os x/i.test(ua)) {
            deviceName = "MacBook / Mac";
        } else {
            deviceName = "Other Device";
        }

        // 1. Total Count Increment
        const visitorRef = ref(db, 'stats/totalVisits');
        runTransaction(visitorRef, (currentVisits) => {
            return (currentVisits || 0) + 1;
        });

        // 2. Save Device and Guest Name Log to Firebase Database
        const devicesRef = ref(db, 'stats/visitorDevices');
        push(devicesRef, {
            name: guestName,
            device: deviceName,
            time: new Date().toLocaleString()
        });
    }

    window.addEventListener('DOMContentLoaded', () => {
        initLoginSystem();
        // Agar pehle se logged in hai toh check karein ke session mein pehli bar visit log hua ya nahi
        let savedName = localStorage.getItem('eSports_GuestName');
        if (savedName && !sessionStorage.getItem('logged_this_session')) {
            logVisitorData(savedName);
            sessionStorage.setItem('logged_this_session', 'true');
        }
    });

    // --- SECRET VIEW SHORTCUT (Ctrl + Shift + A -> Password: Ali 123) ---
    async function checkVisitorDevice() {
        const pwd = prompt("🔒 Enter Secret Password for Visitor Analytics:");
        if (pwd === "Ali 123") {
            const visitsSnap = await get(ref(db, 'stats/totalVisits'));
            const devicesSnap = await get(ref(db, 'stats/visitorDevices'));
            
            const totalVisits = visitsSnap.exists() ? visitsSnap.val() : 0;
            let deviceListText = "";

            if (devicesSnap.exists()) {
                const devicesData = devicesSnap.val();
                let entries = Object.values(devicesData).reverse(); // Latest first
                let recentEntries = entries.slice(0, 10); // Last 10 visitors
                recentEntries.forEach((item, index) => {
                    deviceListText += `\n${index + 1}. Name: ${item.name} | Device: ${item.device} (${item.time})`;
                });
            }

            alert(`📊 TOTAL VISITS: ${totalVisits}\n\n📱 RECENT GUEST USERS & DEVICES:${deviceListText}\n\n(Yeh info sirf aapko secret shortcut se nazar aa rahi hai)`);
        } else if (pwd !== null) {
            alert("❌ Incorrect Password!");
        }
    }

    window.addEventListener('keydown', (e) => {
        if (e.ctrlKey && e.shiftKey && (e.key === 'A' || e.key === 'a' || e.code === 'KeyA')) {
            e.preventDefault();
            checkVisitorDevice();
        }
    });

    let currentCriteria = { master: 100, diamond: 80, gold: 60, silver: 40, bronze: 20 };
    let cachedTeachers = [];
    const previousRanksCache = {}; 

    const loadingState = document.getElementById('loadingState');
    const podiumContainer = document.getElementById('podiumContainer');
    const podiumGrid = document.getElementById('podiumGrid');
    const leaderboardContainer = document.getElementById('leaderboardContainer');
    const leaderboardList = document.getElementById('leaderboardList');
    
    const celebrationOverlay = document.getElementById('celebrationOverlay');
    const celebTeacherName = document.getElementById('celebTeacherName');
    const celebShield = document.getElementById('celebShield');
    const celebRankTitle = document.getElementById('celebRankTitle');

    document.getElementById('openModalBtn').onclick = () => document.getElementById('rankModal').classList.add('active');
    document.getElementById('closeModalBtn').onclick = () => document.getElementById('rankModal').classList.remove('active');
    document.getElementById('closeCelebBtn').onclick = () => celebrationOverlay.classList.remove('active');

    function getTierForScore(score) {
        if (score >= currentCriteria.master) {
            return { name: 'MASTER', color: '#ff0055', bg: 'rgba(255, 0, 85, 0.2)', icon: '👑', grad: 'linear-gradient(135deg, #ff0055, #fbbf24)', tierId: 5 };
        } else if (score >= currentCriteria.diamond) {
            return { name: 'Diamond Tier', color: '#06b6d4', bg: 'rgba(6, 182, 212, 0.15)', icon: '💎', grad: 'linear-gradient(135deg, #0e7490, #22d3ee)', tierId: 4 };
        } else if (score >= currentCriteria.gold) {
            return { name: 'Gold Tier', color: '#ffd700', bg: 'rgba(255, 215, 0, 0.15)', icon: '🥇', grad: 'linear-gradient(135deg, #d97706, #fbbf24)', tierId: 3 };
        } else if (score >= currentCriteria.silver) {
            return { name: 'Silver Tier', color: '#cbd5e1', bg: 'rgba(203, 213, 225, 0.15)', icon: '🥈', grad: 'linear-gradient(135deg, #475569, #cbd5e1)', tierId: 2 };
        } else {
            return { name: 'Bronze I', color: '#cd7f32', bg: 'rgba(205, 127, 50, 0.15)', icon: '🥉', grad: 'linear-gradient(135deg, #a0522d, #cd7f32)', tierId: 1 };
        }
    }

    function triggerGrandCelebration(teacherName, tier) {
        confetti({ particleCount: 100, spread: 80, origin: { y: 0.6 }, colors: ['#38bdf8', '#fbbf24', '#ff0055', '#10b981'] });
        celebTeacherName.textContent = teacherName;
        celebShield.style.background = tier.grad;
        celebShield.textContent = tier.icon;
        celebRankTitle.textContent = tier.name;
        celebRankTitle.style.color = tier.color;
        celebrationOverlay.classList.add('active');
    }

    function renderLeaderboard() {
        if (!cachedTeachers || cachedTeachers.length === 0) return;

        loadingState.style.display = 'none';
        podiumContainer.style.display = 'flex';
        leaderboardContainer.style.display = 'flex';

        podiumGrid.innerHTML = '';
        leaderboardList.innerHTML = '';

        const maxTargetScore = Math.max(currentCriteria.master * 1.2, 100);
        
        const first = cachedTeachers[0] || null;
        const second = cachedTeachers[1] || null;
        const third = cachedTeachers[2] || null;

        const podiumDisplayOrder = [
            { teacher: second, rank: 2 },
            { teacher: first, rank: 1 },
            { teacher: third, rank: 3 }
        ];

        podiumDisplayOrder.forEach(item => {
            if (!item.teacher) return;
            const teacher = item.teacher;
            const currentTier = getTierForScore(teacher.score);
            const rankNum = item.rank;

            if (previousRanksCache[teacher.id] !== undefined && currentTier.tierId > previousRanksCache[teacher.id]) {
                triggerGrandCelebration(teacher.name, currentTier);
            }
            previousRanksCache[teacher.id] = currentTier.tierId;

            const podiumCard = document.createElement('div');
            podiumCard.className = `podium-card rank-${rankNum}`;

            podiumCard.innerHTML = `
                <div class="podium-rank-pill">${rankNum}</div>
                <div class="podium-avatar-shield">${currentTier.icon}</div>
                <div class="podium-name">${teacher.name}</div>
                <div class="podium-score">${teacher.score} PTS</div>
                <div class="podium-score-lbl">Rank #${rankNum}</div>
            `;
            podiumGrid.appendChild(podiumCard);
        });

        cachedTeachers.forEach((teacher, index) => {
            const currentTier = getTierForScore(teacher.score);
            const pos = index + 1;

            if (previousRanksCache[teacher.id] !== undefined && currentTier.tierId > previousRanksCache[teacher.id]) {
                triggerGrandCelebration(teacher.name, currentTier);
            }
            previousRanksCache[teacher.id] = currentTier.tierId;

            const percentage = Math.min((teacher.score / maxTargetScore) * 100, 100);

            const card = document.createElement('div');
            card.className = 'teacher-card';

            card.innerHTML = `
                <div class="pos-badge">#${pos}</div>
                <div class="tier-shield-badge" style="background: ${currentTier.grad};">${currentTier.icon}</div>
                <div class="card-main">
                    <div class="teacher-info">
                        <span class="teacher-name">${teacher.name}</span>
                        <span class="rank-tier-tag" style="color: ${currentTier.color}; background: ${currentTier.bg}; border-color: ${currentTier.color};">${currentTier.name}</span>
                    </div>
                    <div class="glow-line-track">
                        <div class="glow-line-fill" style="width: ${percentage}%; background: ${currentTier.color}; box-shadow: 0 0 6px ${currentTier.color};">
                            <div class="blue-fire"><div class="blue-fire-core"></div></div>
                        </div>
                    </div>
                </div>
                <div class="score-display">
                    <span class="score-num">${teacher.score}</span>
                    <span class="score-lbl">Points</span>
                </div>
            `;
            leaderboardList.appendChild(card);
        });
    }

    const criteriaRef = ref(db, 'rankCriteria');
    onValue(criteriaRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            currentCriteria = {
                master: data.master !== undefined ? data.master : 100,
                diamond: data.diamond !== undefined ? data.diamond : 80,
                gold: data.gold !== undefined ? data.gold : 60,
                silver: data.silver !== undefined ? data.silver : 40,
                bronze: data.bronze !== undefined ? data.bronze : 20
            };
            updateModalChart();
            renderLeaderboard();
        }
    });

    const teachersRef = ref(db, 'teachers');
    onValue(teachersRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            loadingState.innerHTML = `<p style="color: var(--text-secondary); font-size: 0.8rem;">No data found in Firebase.</p>`;
            return;
        }

        cachedTeachers = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        cachedTeachers.sort((a, b) => b.score - a.score);

        renderLeaderboard();
    });

    const rankModalBody = document.getElementById('modalChartBody');
    function updateModalChart() {
        if (!rankModalBody) return;
        const criteriaList = [
            { name: '👑 Master Tier', score: currentCriteria.master, color: '#ff0055' },
            { name: '💎 Diamond Tier', score: currentCriteria.diamond, color: '#06b6d4' },
            { name: '🥇 Gold Tier', score: currentCriteria.gold, color: '#ffd700' },
            { name: '🥈 Silver Tier', score: currentCriteria.silver, color: '#cbd5e1' },
            { name: '🥉 Bronze I', score: currentCriteria.bronze, color: '#cd7f32' }
        ];

        rankModalBody.innerHTML = '';
        criteriaList.forEach(item => {
            const row = document.createElement('div');
            row.style.cssText = `display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 10px;`;
            row.innerHTML = `
                <span style="font-weight: 800; color: ${item.color}; font-size: 0.78rem;">${item.name}</span>
                <span style="font-weight: 800; color: #fff; background: rgba(255,255,255,0.08); padding: 3px 8px; border-radius: 20px; font-size: 0.68rem;">${item.score}+ PTS</span>
            `;
            rankModalBody.appendChild(row);
        });
    }
</script>
</body>
</html>
