<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Firebase Gaming Tier Leaderboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-base: #080a10;
            --surface-card: rgba(16, 22, 36, 0.75);
            --surface-card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: 
                radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.15), transparent),
                radial-gradient(circle at 100% 100%, rgba(6, 182, 212, 0.08), transparent 50%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 0.8rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 880px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
            position: relative;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .badge-header {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(99, 102, 241, 0.1);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .badge-header span {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #10b981;
            box-shadow: 0 0 8px #10b981;
            animation: pulseDot 1.5s infinite ease-in-out;
        }

        @keyframes pulseDot {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.4); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }

        .btn-view-ranks {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            color: #ffffff;
            border: none;
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 0.82rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
            transition: all 0.2s ease;
        }

        .btn-view-ranks:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
            background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
        }

        header h1 {
            font-size: clamp(1.8rem, 5vw, 2.75rem);
            font-weight: 900;
            letter-spacing: -0.02em;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.2;
        }

        header p {
            color: var(--text-secondary);
            font-size: clamp(0.85rem, 2.5vw, 1rem);
            margin-top: 0.5rem;
        }

        .leaderboard {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
        }

        .teacher-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-card-border);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 16px;
            padding: 1rem 1.2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .teacher-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.18);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
        }

        .pos-badge {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-secondary);
            flex-shrink: 0;
        }

        .teacher-card[data-pos="1"] .pos-badge {
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000;
            box-shadow: 0 0 16px rgba(251, 191, 36, 0.4);
            border: none;
        }

        .tier-shield-badge {
            width: 42px;
            height: 42px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 900;
            flex-shrink: 0;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            position: relative;
        }

        .card-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            min-width: 0;
        }

        .teacher-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            width: 100%;
        }

        .teacher-name {
            font-size: clamp(0.95rem, 3.5vw, 1.2rem);
            font-weight: 800;
            color: var(--text-primary);
            white-space: nowrap;
        }

        .rank-tier-tag {
            font-size: 0.65rem;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            flex-shrink: 0;
            border: 1px solid transparent;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            white-space: nowrap;
            text-align: center;
        }

        .glow-line-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 9999px;
            position: relative;
        }

        .glow-line-fill {
            height: 100%;
            border-radius: 9999px;
            position: relative;
            transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .blue-fire {
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            pointer-events: none;
            z-index: 5;
        }

        .blue-fire-core {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: radial-gradient(circle, #ffffff 10%, #38bdf8 40%, #1d4ed8 80%, transparent 100%);
            box-shadow: 0 0 8px #38bdf8, 0 0 16px #2563eb, 0 0 24px #1d4ed8;
            animation: firePulse 0.8s infinite alternate cubic-bezier(0.4, 0, 0.2, 1);
        }

        .blue-fire-spark {
            position: absolute;
            top: -2px;
            right: 2px;
            width: 6px;
            height: 10px;
            background: linear-gradient(0deg, #38bdf8 0%, rgba(59, 130, 246, 0) 100%);
            border-radius: 50% 50% 20% 20%;
            filter: blur(0.5px);
            animation: sparkFlicker 0.4s infinite alternate ease-in-out;
        }

        .score-display {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
            flex-shrink: 0;
            min-width: 60px;
        }

        .score-num {
            font-size: clamp(1.15rem, 4.5vw, 1.5rem);
            font-weight: 800;
            letter-spacing: -0.02em;
            color: #38bdf8;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.4);
            line-height: 1;
        }

        .score-lbl {
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 3px;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(8, 10, 16, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-card {
            background: rgba(15, 22, 38, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            width: 100%;
            max-width: 600px;
            max-height: 85vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            overflow: hidden;
        }

        .modal-overlay.active .modal-card { transform: scale(1); }

        .modal-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--text-primary);
        }

        .close-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .modal-body {
            padding: 1rem 1.2rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        /* Grand Celebration Overlay */
        .celebration-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 14, 0.95);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .celebration-overlay.active { opacity: 1; pointer-events: auto; }

        .celebration-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 2.5rem;
            background: radial-gradient(circle at center, rgba(30, 41, 59, 0.8) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 2px solid rgba(251, 191, 36, 0.5);
            border-radius: 32px;
            box-shadow: 0 0 80px rgba(251, 191, 36, 0.3);
            transform: scale(0.7);
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
            width: 480px;
        }

        .celebration-overlay.active .celebration-box { transform: scale(1); }

        .celebration-subtitle {
            font-size: 0.85rem;
            font-weight: 800;
            letter-spacing: 0.25em;
            color: #fbbf24;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }

        .celebration-teacher-name {
            font-size: clamp(2.2rem, 6vw, 3.2rem);
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #fbbf24 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1.2rem;
            line-height: 1.1;
        }

        .celebration-shield {
            width: 110px;
            height: 110px;
            clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.5rem;
            margin: 1rem 0;
            animation: grandPulse 1.5s infinite alternate ease-in-out;
        }

        .celebration-rank-title {
            font-size: 1.6rem;
            font-weight: 900;
            color: #ffffff;
            margin-top: 0.5rem;
            text-transform: uppercase;
        }

        .celebration-btn {
            margin-top: 1.8rem;
            background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
            color: #000;
            border: none;
            padding: 12px 36px;
            font-size: 1rem;
            font-weight: 900;
            border-radius: 9999px;
            cursor: pointer;
            box-shadow: 0 0 25px rgba(251, 191, 36, 0.5);
        }

        @keyframes grandPulse {
            0% { transform: scale(1) rotate(-2deg); }
            100% { transform: scale(1.12) rotate(2deg); }
        }

        @keyframes firePulse {
            0% { transform: scale(0.85); }
            100% { transform: scale(1.25); }
        }

        @keyframes sparkFlicker {
            0% { opacity: 0.4; transform: translateY(0); }
            100% { opacity: 1; transform: translateY(-4px); }
        }

        @media (max-width: 520px) {
            body { padding: 1rem 0.4rem; }
            .teacher-card { padding: 0.85rem 0.6rem; gap: 0.5rem; }
            .pos-badge { width: 30px; height: 30px; font-size: 0.8rem; }
            .tier-shield-badge { width: 34px; height: 34px; font-size: 0.9rem; }
            .card-main {
                display: grid;
                grid-template-columns: 1fr auto;
                grid-template-rows: auto auto;
                row-gap: 0.5rem;
                column-gap: 0.3rem;
            }
            .teacher-info { display: contents; }
            .teacher-name { grid-column: 1; grid-row: 1; font-size: 0.88rem; }
            .rank-tier-tag { grid-column: 2; grid-row: 1; font-size: 0.55rem; padding: 2px 6px; justify-self: end;}
            .glow-line-track { grid-column: 1 / span 2; grid-row: 2; }
            .score-display { min-width: 45px; }
            .score-num { font-size: 1.05rem; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-top">
            <div class="badge-header">
                <span></span> Firebase Live Sync
            </div>
            <button class="btn-view-ranks" id="openModalBtn">📊 View Rank Criteria</button>
        </div>
        <h1>Faculty Rank Progression</h1>
        <p>Live Competitive Leaderboard Connected to Firebase</p>
    </header>

    <div class="leaderboard" id="leaderboard"></div>
</div>

<!-- Modal Criteria Chart -->
<div class="modal-overlay" id="rankModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3>📊 Rank & Points Criteria Chart</h3>
            <button class="close-btn" id="closeModalBtn">✕</button>
        </div>
        <div class="modal-body" id="modalChartBody"></div>
    </div>
</div>

<!-- Full Screen Rank Up Celebration Overlay -->
<div class="celebration-overlay" id="celebrationOverlay">
    <div class="celebration-box">
        <div class="celebration-subtitle">🎉 LIVE RANK UP ACHIEVED 🎉</div>
        <div class="celebration-teacher-name" id="celebTeacherName">Bushra</div>
        <div class="celebration-shield" id="celebShield">👑</div>
        <div class="celebration-rank-title" id="celebRankTitle">MASTER</div>
        <button class="celebration-btn" id="closeCelebBtn">AWESOME!</button>
    </div>
</div>

<!-- Firebase Modular SDK -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBuHPFJpWH-ururuUcpuDKf0vskaKFvcwQ",
      authDomain: "teacher-of-the-week-81ddb.firebaseapp.com",
      projectId: "teacher-of-the-week-81ddb",
      storageBucket: "teacher-of-the-week-81ddb.firebasestorage.app",
      messagingSenderId: "120486545659",
      appId: "1:120486545659:web:ff734bdbeb88f7de82485e"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // Global Dynamic Criteria Config
    let currentCriteria = { master: 100, diamond: 80, gold: 60, silver: 40, bronze: 20 };
    let cachedTeachers = [];
    const previousRanksCache = {}; 

    const leaderboardEl = document.getElementById('leaderboard');
    const celebrationOverlay = document.getElementById('celebrationOverlay');
    const celebTeacherName = document.getElementById('celebTeacherName');
    const celebShield = document.getElementById('celebShield');
    const celebRankTitle = document.getElementById('celebRankTitle');

    document.getElementById('openModalBtn').onclick = () => document.getElementById('rankModal').classList.add('active');
    document.getElementById('closeModalBtn').onclick = () => document.getElementById('rankModal').classList.remove('active');
    document.getElementById('closeCelebBtn').onclick = () => celebrationOverlay.classList.remove('active');

    // Dynamic Rank Calculator based on Admin Criteria
    function getTierForScore(score) {
        if (score >= currentCriteria.master) {
            return { name: 'MASTER', color: '#ff0055', bg: 'rgba(255, 0, 85, 0.2)', icon: '👑', grad: 'linear-gradient(135deg, #ff0055, #fbbf24)', tierId: 5 };
        } else if (score >= currentCriteria.diamond) {
            return { name: 'Diamond Tier', color: '#06b6d4', bg: 'rgba(6, 182, 212, 0.15)', icon: '💎', grad: 'linear-gradient(135deg, #0e7490, #22d3ee)', tierId: 4 };
        } else if (score >= currentCriteria.gold) {
            return { name: 'Gold Tier', color: '#ffd700', bg: 'rgba(255, 215, 0, 0.15)', icon: '🥇', grad: 'linear-gradient(135deg, #d97706, #fbbf24)', tierId: 3 };
        } else if (score >= currentCriteria.silver) {
            return { name: 'Silver Tier', color: '#94a3b8', bg: 'rgba(148, 163, 184, 0.15)', icon: '🥈', grad: 'linear-gradient(135deg, #475569, #cbd5e1)', tierId: 2 };
        } else {
            return { name: 'Bronze Tier', color: '#cd7f32', bg: 'rgba(205, 127, 50, 0.15)', icon: '🥉', grad: 'linear-gradient(135deg, #a0522d, #cd7f32)', tierId: 1 };
        }
    }

    function triggerGrandCelebration(teacherName, tier) {
        confetti({ particleCount: 100, spread: 100, origin: { y: 0.6 } });
        celebTeacherName.textContent = teacherName;
        celebShield.style.background = tier.grad;
        celebShield.textContent = tier.icon;
        celebRankTitle.textContent = tier.name;
        celebRankTitle.style.color = tier.color;
        celebrationOverlay.classList.add('active');
    }

    function renderLeaderboard() {
        if (!cachedTeachers || cachedTeachers.length === 0) return;

        leaderboardEl.innerHTML = '';
        const maxTargetScore = Math.max(currentCriteria.master * 1.2, 100);

        cachedTeachers.forEach((teacher, index) => {
            const currentTier = getTierForScore(teacher.score);

            // Trigger Rank Up Overlay when score crosses threshold
            if (previousRanksCache[teacher.id] !== undefined && currentTier.tierId > previousRanksCache[teacher.id]) {
                triggerGrandCelebration(teacher.name, currentTier);
            }
            previousRanksCache[teacher.id] = currentTier.tierId;

            const percentage = Math.min((teacher.score / maxTargetScore) * 100, 100);
            const pos = index + 1;
            const posIcon = pos === 1 ? '👑' : `#${pos}`;

            const card = document.createElement('div');
            card.className = 'teacher-card';
            card.setAttribute('data-pos', pos);

            card.innerHTML = `
                <div class="pos-badge">${posIcon}</div>
                <div class="tier-shield-badge" style="background: ${currentTier.grad};">${currentTier.icon}</div>
                <div class="card-main">
                    <div class="teacher-info">
                        <span class="teacher-name">${teacher.name}</span>
                        <span class="rank-tier-tag" style="color: ${currentTier.color}; background: ${currentTier.bg}; border-color: ${currentTier.color};">${currentTier.name}</span>
                    </div>
                    <div class="glow-line-track">
                        <div class="glow-line-fill" style="width: ${percentage}%; background: ${currentTier.color}; box-shadow: 0 0 10px ${currentTier.color};">
                            <div class="blue-fire"><div class="blue-fire-core"></div><div class="blue-fire-spark"></div></div>
                        </div>
                    </div>
                </div>
                <div class="score-display">
                    <span class="score-num">${teacher.score}</span>
                    <span class="score-lbl">Points</span>
                </div>
            `;
            leaderboardEl.appendChild(card);
        });
    }

    // 1. LISTEN TO RANK CRITERIA FROM ADMIN PANEL
    const criteriaRef = ref(db, 'rankCriteria');
    onValue(criteriaRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            currentCriteria = {
                master: data.master !== undefined ? data.master : 100,
                diamond: data.diamond !== undefined ? data.diamond : 80,
                gold: data.gold !== undefined ? data.gold : 60,
                silver: data.silver !== undefined ? data.silver : 40,
                bronze: data.bronze !== undefined ? data.bronze : 20
            };
            
            updateModalChart();
            renderLeaderboard();
        }
    });

    // 2. LISTEN TO TEACHERS LIST LIVE
    const teachersRef = ref(db, 'teachers');
    onValue(teachersRef, (snapshot) => {
        const data = snapshot.val();
        if (!data) return;

        cachedTeachers = Object.keys(data).map(key => ({ id: key, ...data[key] }));
        cachedTeachers.sort((a, b) => b.score - a.score);

        renderLeaderboard();
    });

    // Update Rank Modal View
    const rankModalBody = document.getElementById('modalChartBody');
    function updateModalChart() {
        if (!rankModalBody) return;

        const criteriaList = [
            { name: '👑 Master Tier', score: currentCriteria.master, color: '#ff0055' },
            { name: '💎 Diamond Tier', score: currentCriteria.diamond, color: '#06b6d4' },
            { name: '🥇 Gold Tier', score: currentCriteria.gold, color: '#ffd700' },
            { name: '🥈 Silver Tier', score: currentCriteria.silver, color: '#cbd5e1' },
            { name: '🥉 Bronze Tier', score: currentCriteria.bronze, color: '#cd7f32' }
        ];

        rankModalBody.innerHTML = '';
        
        criteriaList.forEach(item => {
            const row = document.createElement('div');
            row.style.cssText = `
                display: flex;
                justify-content: space-between;
                align-items: center;
                padding: 12px 16px;
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
            `;
            
            row.innerHTML = `
                <span style="font-weight: 800; color: ${item.color};">${item.name}</span>
                <span style="font-weight: 800; color: #fff; background: rgba(255,255,255,0.1); padding: 4px 12px; border-radius: 20px;">
                    ${item.score}+ Points
                </span>
            `;
            rankModalBody.appendChild(row);
        });
    }
</script>
</body>
</html>
