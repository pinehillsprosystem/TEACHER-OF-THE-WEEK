<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Admin Panel</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #080a10;
            --surface-card: rgba(16, 22, 36, 0.85);
            --surface-card-border: rgba(255, 255, 255, 0.1);
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --danger: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-base);
            background-image: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(99, 102, 241, 0.2), transparent);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .admin-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        header {
            text-align: center;
        }

        header h1 {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.3rem;
        }

        .card {
            background: var(--surface-card);
            border: 1px solid var(--surface-card-border);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 1.5rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 800;
            margin-bottom: 1rem;
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 0.8rem;
            align-items: center;
        }

        @media (max-width: 550px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
        }

        input {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 10px 14px;
            border-radius: 12px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 10px rgba(99, 102, 241, 0.3);
        }

        .btn {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-hover) 100%);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
        }

        .teacher-list {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .teacher-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.8rem 1.2rem;
            border-radius: 14px;
            gap: 1rem;
        }

        .teacher-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .teacher-name-title {
            font-weight: 800;
            font-size: 1rem;
        }

        .score-input-wrap {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-input-wrap input {
            width: 80px;
            text-align: center;
        }

        .btn-update {
            background: #10b981;
            padding: 8px 14px;
            font-size: 0.8rem;
        }

        .btn-update:hover {
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .btn-delete {
            background: rgba(244, 63, 94, 0.15);
            border: 1px solid rgba(244, 63, 94, 0.3);
            color: var(--danger);
            padding: 8px 12px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.8rem;
            transition: all 0.2s ease;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: #fff;
        }
    </style>
</head>
<body>

<div class="admin-container">
    <header>
        <h1>⚡ Leaderboard Control Panel</h1>
        <p>Live Firebase Realtime Management</p>
    </header>

    <!-- Add New Teacher -->
    <div class="card">
        <div class="card-title">➕ Add New Faculty Member</div>
        <div class="form-grid">
            <input type="text" id="newTeacherName" placeholder="Teacher Name (e.g. Ayesha)" />
            <input type="number" id="newTeacherScore" placeholder="Initial Points (e.g. 50)" />
            <button class="btn" id="addTeacherBtn">Add Teacher</button>
        </div>
    </div>

    <!-- Manage Existing Teachers -->
    <div class="card">
        <div class="card-title">⚙️ Update Scores & Members</div>
        <div class="teacher-list" id="teachersListContainer">
            <p style="color: var(--text-secondary); text-align: center;">Loading data from Firebase...</p>
        </div>
    </div>
</div>

<!-- Firebase Integration -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, update, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔴 REPLACE THIS WITH YOUR EXACT FIREBASE CONFIG
  const firebaseConfig = {
  apiKey: "AIzaSyBuHPFJpWH-ururuUcpuDKf0vskaKFvcwQ",
  authDomain: "teacher-of-the-week-81ddb.firebaseapp.com",
  projectId: "teacher-of-the-week-81ddb",
  storageBucket: "teacher-of-the-week-81ddb.firebasestorage.app",
  messagingSenderId: "120486545659",
  appId: "1:120486545659:web:ff734bdbeb88f7de82485e"
};

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const teachersRef = ref(db, 'teachers');

    const teachersListContainer = document.getElementById('teachersListContainer');
    const newTeacherName = document.getElementById('newTeacherName');
    const newTeacherScore = document.getElementById('newTeacherScore');
    const addTeacherBtn = document.getElementById('addTeacherBtn');

    // Add New Teacher
    addTeacherBtn.onclick = () => {
        const name = newTeacherName.value.trim();
        const score = parseInt(newTeacherScore.value.trim());

        if (!name || isNaN(score)) {
            alert("Please enter a valid Name and Score!");
            return;
        }

        const newRef = push(teachersRef);
        update(newRef, { name: name, score: score }).then(() => {
            newTeacherName.value = '';
            newTeacherScore.value = '';
        });
    };

    // Live Render and Edit Controls
    onValue(teachersRef, (snapshot) => {
        const data = snapshot.val();
        teachersListContainer.innerHTML = '';

        if (!data) {
            teachersListContainer.innerHTML = `<p style="color: var(--text-secondary); text-align: center;">No teachers found. Add one above!</p>`;
            return;
        }

        Object.keys(data).forEach(id => {
            const item = data[id];
            const row = document.createElement('div');
            row.className = 'teacher-row';

            row.innerHTML = `
                <div class="teacher-info">
                    <span class="teacher-name-title">${item.name}</span>
                </div>
                <div class="score-input-wrap">
                    <input type="number" value="${item.score}" id="input-${id}" />
                    <button class="btn btn-update" data-id="${id}">Save Score</button>
                    <button class="btn-delete" data-del="${id}">🗑️</button>
                </div>
            `;
            teachersListContainer.appendChild(row);
        });

        // Event Handler: Update Score
        document.querySelectorAll('.btn-update').forEach(btn => {
            btn.onclick = (e) => {
                const id = e.target.getAttribute('data-id');
                const val = parseInt(document.getElementById(`input-${id}`).value);
                if (!isNaN(val)) {
                    update(ref(db, `teachers/${id}`), { score: val });
                }
            };
        });

        // Event Handler: Delete Member
        document.querySelectorAll('.btn-delete').forEach(btn => {
            btn.onclick = (e) => {
                const id = e.target.getAttribute('data-del');
                if (confirm("Are you sure you want to delete this teacher?")) {
                    remove(ref(db, `teachers/${id}`));
                }
            };
        });
    });
</script>

</body>
</html>
